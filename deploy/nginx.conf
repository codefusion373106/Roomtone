# nginx in front of gunicorn: TLS, gzip for the static assets the app does not
# compress itself, and long caching for fingerprinted CSS/JS.

upstream musicfocus {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name focus.example.com;   # <- your domain

    # certbot --nginx rewrites this block to redirect to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name focus.example.com;   # <- your domain

    ssl_certificate     /etc/letsencrypt/live/focus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focus.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # The audio is fetched by the visitor's browser straight from
    # datashat.net, so this server never carries audio bytes. These limits are
    # sized for the ~27 KB gzipped catalog plus static assets.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/json
               application/javascript text/javascript image/svg+xml;

    # Static assets: the app already sends max-age=86400.
    location /static/ {
        proxy_pass http://musicfocus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1d;
    }

    location = /healthz {
        proxy_pass http://musicfocus;
        access_log off;
    }

    location / {
        proxy_pass http://musicfocus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
}